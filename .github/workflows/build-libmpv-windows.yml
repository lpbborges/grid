# Builds the LGPL libmpv that Grid bundles on Windows.
# See src-tauri/licenses/README.md. Manual: run it, check BUILD-INFO.txt, then
# pin the new release's URL and SHA256 in scripts/libmpv.lock.json.
name: Build libmpv (Windows, LGPL)

on:
  workflow_dispatch:
    inputs:
      mpv_ref: { description: mpv tag, required: true, default: v0.41.0 }
      ffmpeg_ref: { description: FFmpeg tag, required: true, default: n7.1.5 }
      libplacebo_ref: { description: libplacebo tag, required: true, default: v7.351.0 }

permissions:
  contents: write

env:
  MPV_REF: ${{ inputs.mpv_ref || 'v0.41.0' }}
  FFMPEG_REF: ${{ inputs.ffmpeg_ref || 'n7.1.5' }}
  LIBPLACEBO_REF: ${{ inputs.libplacebo_ref || 'v7.351.0' }}

defaults:
  run:
    shell: msys2 {0}

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 150
    steps:
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            git tar xz zstd curl make diffutils
          # toolchain:p brings binutils (objdump, for the DLL closure walk).
          # spirv-headers:p is linked by nothing: it is installed for the notice
          # of the SPIR-V tables compiled into libshaderc_shared.dll.
          pacboy: >-
            toolchain:p meson:p ninja:p pkgconf:p nasm:p
            dav1d:p libass:p freetype:p harfbuzz:p fribidi:p zlib:p
            shaderc:p spirv-cross:p spirv-headers:p
      - name: Check out this workflow
        uses: actions/checkout@v7
        with:
          path: grid
          persist-credentials: false
          sparse-checkout: .github/workflows/build-libmpv-windows.yml
          sparse-checkout-cone-mode: false
      - name: Fetch sources
        run: |
          git clone --depth 1 --branch "$FFMPEG_REF" https://git.ffmpeg.org/ffmpeg.git
          git clone --depth 1 --branch "$LIBPLACEBO_REF" --recurse-submodules https://code.videolan.org/videolan/libplacebo.git
          git clone --depth 1 --branch "$MPV_REF" https://github.com/mpv-player/mpv.git
      - name: Snapshot the source trees
        run: |
          # Taken before anything is built, as on Linux: FFmpeg builds in its
          # tree and meson leaves byproducts (e.g. __pycache__) in the source
          # trees. A plain copy keeps libplacebo's submodules, which a local git
          # clone would fetch again from the network. The archive step adds the
          # MSYS2 source packages.
          mkdir -p src/msys2
          cp -r ffmpeg libplacebo mpv src/
          cp grid/.github/workflows/build-libmpv-windows.yml src/
      - name: FFmpeg (LGPL-2.1 - no gpl, no version3, no nonfree)
        run: |
          export PKG_CONFIG_PATH="$PWD/out/lib/pkgconfig:$PKG_CONFIG_PATH"
          cd ffmpeg
          opts=(--prefix="$PWD/../out" --enable-shared --disable-static
            --disable-programs --disable-doc --disable-debug --disable-encoders --disable-muxers
            --disable-avdevice --enable-libdav1d --enable-d3d11va --enable-dxva2 --disable-bzlib --disable-lzma
            --disable-iconv --disable-sdl2 --disable-schannel)
          echo "${opts[*]}" > "$RUNNER_TEMP/ffmpeg-options"
          ./configure "${opts[@]}"
          grep -q 'CONFIG_GPL 0' config.h
          grep -q 'CONFIG_VERSION3 0' config.h
          grep -q 'CONFIG_NONFREE 0' config.h
          grep -q 'CONFIG_D3D11VA 1' config.h
          make -j"$(nproc)" && make install
      - name: libplacebo
        run: |
          export PKG_CONFIG_PATH="$PWD/out/lib/pkgconfig:$PKG_CONFIG_PATH"
          opts=(--prefix="$PWD/out" --buildtype=release -Dd3d11=enabled -Dvulkan=disabled -Dopengl=disabled
            -Dshaderc=enabled -Dglslang=disabled -Dlcms=disabled -Ddovi=disabled
            -Dlibdovi=disabled -Ddemos=false -Dtests=false)
          echo "${opts[*]}" > "$RUNNER_TEMP/libplacebo-options"
          meson setup libplacebo/build libplacebo "${opts[@]}"
          meson install -C libplacebo/build
      - name: libmpv (-Dgpl=false)
        run: |
          export PKG_CONFIG_PATH="$PWD/out/lib/pkgconfig:$PKG_CONFIG_PATH"
          opts=(--prefix="$PWD/out" --buildtype=release -Dgpl=false -Dlibmpv=true -Dcplayer=false
            -Dlua=disabled -Djavascript=disabled -Dlibarchive=disabled -Dlibbluray=disabled
            -Duchardet=disabled -Drubberband=disabled -Dlcms2=disabled -Djpeg=disabled
            -Dvapoursynth=disabled -Dsdl2-gamepad=disabled -Dwin32-smtc=disabled
            -Dvulkan=disabled -Dgl=disabled -Degl-angle=disabled -Dlibavdevice=disabled
            -Dd3d11=enabled -Dd3d-hwaccel=enabled -Dspirv-cross=enabled -Dshaderc=enabled)
          echo "${opts[*]}" > "$RUNNER_TEMP/mpv-options"
          meson setup mpv/build mpv "${opts[@]}"
          # Read back from the configured build, not the echoed options (as on Linux).
          meson configure mpv/build | grep -E '^\s*gpl\s+false'
          meson install -C mpv/build
      - name: libmpv has what Grid's Windows player uses
        run: |
          features=$(sed -n 's/^#define FULLCONFIG "\(.*\)"$/\1/p' mpv/build/config.h)
          echo "mpv features: $features"
          [ -n "$features" ] || { echo "::error::FULLCONFIG not found"; exit 1; }
          for f in d3d11 d3d-hwaccel libass libplacebo shaderc spirv-cross; do
            [[ " $features " == *" $f "* ]] || { echo "::error::mpv was built without $f"; exit 1; }
          done
          for f in gpl lua javascript libavdevice; do
            [[ " $features " != *" $f "* ]] || { echo "::error::mpv was built with $f"; exit 1; }
          done
          echo "$features" > "$RUNNER_TEMP/mpv-features"
          ls out/bin
      - name: DLL closure
        run: |
          # Helpers shared by this and the next steps.
          cat > "$RUNNER_TEMP/helpers.sh" <<'EOF'
          P=mingw-w64-ucrt-x86_64-
          # Imported DLL names of a PE file, lower-cased.
          imports() {
            local out
            out=$(objdump -p "$1") || return 1
            sed -n 's/^[[:space:]]*DLL Name: //p' <<< "$out" | tr -d '\r' | tr '[:upper:]' '[:lower:]'
          }
          # A field of an installed package: pkginfo <full package name> <BASE|VERSION|LICENSE>.
          # Multi-line fields (LICENSE) are joined with ';'.
          pkginfo() {
            local q desc
            q=$(pacman -Q "$1") || return 1
            desc="/var/lib/pacman/local/${q/ /-}/desc"
            awk -v f="%$2%" '$0 == f { on = 1; next } /^%/ { on = 0 } on && NF' "$desc" | paste -sd';'
          }
          EOF
          . "$RUNNER_TEMP/helpers.sh"

          # Walk the import tables from libmpv-2.dll: every DLL it needs that is
          # not part of Windows ships beside grid.exe. (ntldd -R is not used: it
          # recurses into System32 and reports API-set names as "not found".)
          declare -A where needed_by seen
          # out/bin is read last so our builds win a name clash.
          for f in /ucrt64/bin/*.dll out/bin/*.dll; do
            n=$(basename "$f" | tr '[:upper:]' '[:lower:]'); where[$n]=$f
          done
          sys="$(cygpath -u "$SYSTEMROOT")/System32"
          : > "$RUNNER_TEMP/closure.txt"
          queue=(libmpv-2.dll); bad=0
          while [ ${#queue[@]} -gt 0 ]; do
            n=${queue[0]}; queue=("${queue[@]:1}")
            [ -z "${seen[$n]:-}" ] || continue
            seen[$n]=1
            if [ -n "${where[$n]:-}" ]; then
              echo "${where[$n]}" >> "$RUNNER_TEMP/closure.txt"
              # Every DLL imports something (kernel32 at least): an empty list
              # means objdump could not read it, and its dependencies would be lost.
              deps=$(imports "${where[$n]}") || deps=
              if [ -z "$deps" ]; then
                echo "::error::could not read the imports of ${where[$n]}"; bad=1; continue
              fi
              for dep in $deps; do
                needed_by[$dep]=${needed_by[$dep]:-$n}; queue+=("$dep")
              done
              continue
            fi
            case "$n" in
              vcruntime*|msvcp*|concrt*|vccorlib*|ucrtbased.dll)
                echo "::error::$n (needed by ${needed_by[$n]}) is a Visual C++ redistributable, not part of Windows"; bad=1 ;;
              api-ms-win-*|ext-ms-*) ;;
              *)
                [ -e "$sys/$n" ] \
                  || { echo "::error::$n (needed by ${needed_by[$n]}) is in neither out/bin, /ucrt64/bin nor System32"; bad=1; } ;;
            esac
          done
          sort -u -o "$RUNNER_TEMP/closure.txt" "$RUNNER_TEMP/closure.txt"
          echo "closure ($(wc -l < "$RUNNER_TEMP/closure.txt") DLLs):"; cat "$RUNNER_TEMP/closure.txt"
          [ "$bad" = 0 ] || exit 1

          # The MSYS2 packages whose notices ship: each shipped DLL's package,
          # plus the toolchain and shaderc parts compiled statically into the DLLs.
          {
            grep '^/ucrt64/bin/' "$RUNNER_TEMP/closure.txt" | xargs pacman -Qqo | sed "s/^$P//"
            printf '%s\n' crt headers gcc winpthreads glslang spirv-tools spirv-headers
          } | sort -u > "$RUNNER_TEMP/packages.txt"
          # The LGPL ones also ship their exact MSYS2 source package.
          while read -r short; do
            lic=$(pkginfo "$P$short" LICENSE)
            if [[ $lic == *LGPL* ]]; then echo "$short"; fi
          done < "$RUNNER_TEMP/packages.txt" > "$RUNNER_TEMP/source-packages.txt"
          echo "source ships for:"; cat "$RUNNER_TEMP/source-packages.txt"
      - name: Archive the corresponding source
        run: |
          . "$RUNNER_TEMP/helpers.sh"
          # The upstream trees (snapshotted before the build) + the exact MSYS2
          # source package of every LGPL package that ships.
          while read -r short; do
            echo "$(pkginfo "$P$short" BASE)-$(pkginfo "$P$short" VERSION)"
          done < "$RUNNER_TEMP/source-packages.txt" | sort -u > "$RUNNER_TEMP/sources.txt"
          while read -r src; do
            curl -fsSL --retry 3 -o "src/msys2/$src.src.tar.zst" "https://repo.msys2.org/mingw/sources/$src.src.tar.zst"
          done < "$RUNNER_TEMP/sources.txt"
          XZ_OPT=-T0 tar -cJf libmpv-windows-source.tar.xz --exclude-vcs \
            --transform 's|^src|libmpv-windows-source|' src
          sha256sum --text libmpv-windows-source.tar.xz | tee libmpv-windows-source.tar.xz.sha256
      - name: Package
        run: |
          . "$RUNNER_TEMP/helpers.sh"
          mkdir -p dist/bin dist/include dist/LICENSES
          while read -r f; do cp "$f" dist/bin/; done < "$RUNNER_TEMP/closure.txt"
          # Our builds only: MSYS2's DLLs ship stripped already.
          for f in out/bin/*.dll; do strip --strip-debug "dist/bin/$(basename "$f")"; done
          cp -a out/include/mpv dist/include/
          cp mpv/LICENSE.LGPL dist/LICENSES/mpv-LGPL-2.1.txt
          cp ffmpeg/COPYING.LGPLv2.1 dist/LICENSES/ffmpeg-LGPL-2.1.txt
          cp libplacebo/LICENSE dist/LICENSES/libplacebo-LGPL-2.1.txt
          cp libplacebo/3rdparty/fast_float/LICENSE-MIT dist/LICENSES/fast_float-MIT.txt
          cp libplacebo/3rdparty/Vulkan-Headers/LICENSE.md dist/LICENSES/Vulkan-Headers-LICENSE.md
          cp libplacebo/3rdparty/Vulkan-Headers/LICENSES/Apache-2.0.txt dist/LICENSES/Vulkan-Headers-Apache-2.0.txt
          cp libplacebo/3rdparty/Vulkan-Headers/LICENSES/MIT.txt dist/LICENSES/Vulkan-Headers-MIT.txt
          # One folder per MSYS2 package, with the licence files it installs.
          while read -r short; do
            if [ -n "$(find "/ucrt64/share/licenses/$short" -type f -print -quit 2>/dev/null)" ]; then
              cp -r "/ucrt64/share/licenses/$short" "dist/LICENSES/$short"
            elif [ "$short" = libass ]; then
              # MSYS2's libass installs no licence file: take COPYING from the
              # upstream tarball inside its source package.
              v=$(pkginfo "${P}libass" VERSION); up=${v%-*}
              curl -fsSL --retry 3 -o "$RUNNER_TEMP/libass.src.tar.zst" \
                "https://repo.msys2.org/mingw/sources/mingw-w64-libass-$v.src.tar.zst"
              mkdir -p dist/LICENSES/libass
              # --force-local: $RUNNER_TEMP is D:\a\_temp, and tar reads "D:" as a remote host.
              tar --force-local --zstd -xOf "$RUNNER_TEMP/libass.src.tar.zst" "mingw-w64-libass/libass-$up.tar.xz" \
                | tar -xJOf - "libass-$up/COPYING" > dist/LICENSES/libass/COPYING
            else
              echo "::error::$P$short installs no licence files"; exit 1
            fi
          done < "$RUNNER_TEMP/packages.txt"
          {
            echo "mpv $MPV_REF $(git -C mpv rev-parse HEAD)"
            echo "  meson setup: $(cat "$RUNNER_TEMP/mpv-options")"
            echo "  features: $(cat "$RUNNER_TEMP/mpv-features")"
            echo "ffmpeg $FFMPEG_REF $(git -C ffmpeg rev-parse HEAD)"
            echo "  configure: $(sed -n 's/^#define FFMPEG_CONFIGURATION "\(.*\)"$/\1/p' ffmpeg/config.h)"
            echo "libplacebo $LIBPLACEBO_REF $(git -C libplacebo rev-parse HEAD)"
            echo "  meson setup: $(cat "$RUNNER_TEMP/libplacebo-options")"
            echo "MSYS2 UCRT64 packages (shipped DLLs and static parts):"
            while read -r short; do echo "  $(pacman -Q "$P$short")"; done < "$RUNNER_TEMP/packages.txt"
            echo "MSYS2 sources: https://repo.msys2.org/mingw/sources/ (LGPL ones in the source archive)"
            echo "source: libmpv-windows-source.tar.xz sha256 $(cut -d' ' -f1 libmpv-windows-source.tar.xz.sha256)"
          } > dist/BUILD-INFO.txt
          cat dist/BUILD-INFO.txt
          tar -C dist -czf libmpv-windows-x86_64.tar.gz .
          sha256sum --text libmpv-windows-x86_64.tar.gz | tee libmpv-windows-x86_64.tar.gz.sha256
      - name: Publish
        # Git for Windows' bash (the runner's `bash`), not MSYS2's: the runner's
        # preinstalled gh is on its PATH, and the script stays identical to the
        # Linux workflow's. Both shells start in the workspace, where the files are.
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          # Every build is its own immutable release: scripts/libmpv.lock.json pins
          # a URL and SHA256, and the build is not bit-reproducible, so a published
          # asset must never be replaced. `gh release create` fails if the tag exists.
          gh --version
          tag="libmpv-windows-$MPV_REF-b$GITHUB_RUN_NUMBER"
          gh release create "$tag" libmpv-windows-x86_64.tar.gz libmpv-windows-x86_64.tar.gz.sha256 \
            libmpv-windows-source.tar.xz libmpv-windows-source.tar.xz.sha256 \
            --target "$GITHUB_SHA" --title "libmpv $MPV_REF build $GITHUB_RUN_NUMBER (Windows, LGPL)" \
            --notes-file dist/BUILD-INFO.txt --prerelease
