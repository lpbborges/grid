# Builds the LGPL libmpv that Grid bundles in its Linux packages.
# See src-tauri/licenses/README.md. Manual: run it, check BUILD-INFO.txt, then
# pin the new release's URL and SHA256 in scripts/libmpv.lock.json.
# Run it with workflow_dispatch from the default branch.
name: Build libmpv (Linux, LGPL)

on:
  workflow_dispatch:
    inputs:
      mpv_ref: { description: mpv tag, required: true, default: v0.41.0 }
      ffmpeg_ref: { description: FFmpeg tag, required: true, default: n7.1 }
      libplacebo_ref: { description: libplacebo tag, required: true, default: v7.351.0 }
      dav1d_ref: { description: dav1d tag, required: true, default: 1.5.1 }
      libdisplay_info_ref: { description: libdisplay-info tag, required: true, default: 0.2.0 }

permissions:
  contents: write

env:
  MPV_REF: ${{ inputs.mpv_ref || 'v0.41.0' }}
  FFMPEG_REF: ${{ inputs.ffmpeg_ref || 'n7.1' }}
  LIBPLACEBO_REF: ${{ inputs.libplacebo_ref || 'v7.351.0' }}
  # dav1d is bundled because its soname differs across distributions.
  DAV1D_REF: ${{ inputs.dav1d_ref || '1.5.1' }}
  # libdisplay-info is bundled for the same reason (libdisplay-info.so.1/.2/.3);
  # mpv's drm feature, which VA-API needs here, requires it.
  LIBDISPLAY_INFO_REF: ${{ inputs.libdisplay_info_ref || '0.2.0' }}

defaults:
  run:
    shell: bash

jobs:
  build:
    # Ubuntu 24.04: its glibc (2.39) is the floor the Grid binary itself already
    # needs, and its libva/libdrm are new enough for mpv's VA-API support.
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential nasm pkg-config \
            python3-venv ninja-build git patchelf hwdata libass-dev libfreetype-dev libfribidi-dev \
            libharfbuzz-dev libva-dev libdrm-dev libegl-dev libgl-dev \
            libvulkan-dev glslang-dev spirv-tools libx11-dev libwayland-dev wayland-protocols \
            libxkbcommon-dev libpulse-dev libasound2-dev
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install 'meson>=1.3' jinja2 glad2
          echo "$RUNNER_TEMP/venv/bin" >> "$GITHUB_PATH"
      - name: Fetch sources
        run: |
          git clone --depth 1 --branch "$DAV1D_REF" https://code.videolan.org/videolan/dav1d.git
          git clone --depth 1 --branch "$LIBDISPLAY_INFO_REF" https://gitlab.freedesktop.org/emersion/libdisplay-info.git
          git clone --depth 1 --branch "$FFMPEG_REF" https://git.ffmpeg.org/ffmpeg.git
          git clone --depth 1 --branch "$LIBPLACEBO_REF" --recurse-submodules https://code.videolan.org/videolan/libplacebo.git
          git clone --depth 1 --branch "$MPV_REF" https://github.com/mpv-player/mpv.git
      - name: dav1d
        run: |
          opts=(--prefix="$PWD/out" --libdir=lib --buildtype=release
            -Denable_tools=false -Denable_tests=false -Denable_examples=false)
          echo "${opts[*]}" > "$RUNNER_TEMP/dav1d-options"
          meson setup dav1d/build dav1d "${opts[@]}"
          meson install -C dav1d/build
      - name: libdisplay-info
        run: |
          # Its PNP ID table is generated from hwdata's pnp.ids at build time.
          opts=(--prefix="$PWD/out" --libdir=lib --buildtype=release)
          echo "${opts[*]}" > "$RUNNER_TEMP/libdisplay-info-options"
          meson setup libdisplay-info/build libdisplay-info "${opts[@]}"
          meson install -C libdisplay-info/build
      - name: FFmpeg (LGPL - no --enable-gpl, no --enable-nonfree)
        run: |
          export PKG_CONFIG_PATH="$PWD/out/lib/pkgconfig"
          cd ffmpeg
          # bzlib and lzma are off: their sonames differ across distributions
          # (libbz2.so.1.0 vs libbz2.so.1) and playback does not need them.
          ./configure --prefix="$PWD/../out" --enable-shared --disable-static \
            --disable-programs --disable-doc --disable-debug \
            --enable-libdav1d --enable-vaapi --disable-bzlib --disable-lzma
          grep -q 'CONFIG_GPL 0' config.h
          grep -q 'CONFIG_NONFREE 0' config.h
          # mpv's VA-API hardware decoding goes through FFmpeg's.
          grep -q 'CONFIG_VAAPI 1' config.h
          # FFmpeg must link the bundled dav1d, not a system one.
          grep -q -- "-L$(cd .. && pwd)/out/lib -ldav1d" ffbuild/config.mak
          make -j"$(nproc)" && make install
      - name: libplacebo
        run: |
          export PKG_CONFIG_PATH="$PWD/out/lib/pkgconfig"
          opts=(--prefix="$PWD/out" --libdir=lib -Dvulkan=enabled -Dopengl=enabled
            -Dshaderc=disabled -Dglslang=enabled -Dlcms=disabled -Ddemos=false -Dtests=false)
          echo "${opts[*]}" > "$RUNNER_TEMP/libplacebo-options"
          meson setup libplacebo/build libplacebo "${opts[@]}"
          meson install -C libplacebo/build
          # libplacebo's libav.h pulls in FFmpeg's hwcontext_vulkan.h, which needs
          # Vulkan headers at least as new as libplacebo's own; the runner's may
          # lag behind. Build-time only: the package copies include/mpv alone.
          cp -r libplacebo/3rdparty/Vulkan-Headers/include/. out/include/
      - name: libmpv (-Dgpl=false)
        run: |
          export PKG_CONFIG_PATH="$PWD/out/lib/pkgconfig"
          # Hardware decoding through the render API: VA-API opens a DRM render
          # node (vaapi-drm, which needs drm) and hands frames to Grid's OpenGL
          # context as dma-bufs (dmabuf-interop-gl, which needs egl). x11 and
          # everything built on it are GPL-only in mpv and stay off. Wayland is
          # off: Grid does not pass mpv a Wayland display, so mpv would not use
          # it, and gbm/egl-drm only serve mpv's own DRM video output.
          opts=(--prefix="$PWD/out" --libdir=lib -Dgpl=false -Dlibmpv=true -Dcplayer=false
            -Dlua=disabled -Djavascript=disabled -Djpeg=disabled -Dlcms2=disabled
            -Dvaapi=enabled -Dvaapi-drm=enabled -Ddrm=enabled -Degl=enabled
            -Dx11=disabled -Dwayland=disabled -Dgbm=disabled -Degl-drm=disabled)
          echo "${opts[*]}" > "$RUNNER_TEMP/mpv-options"
          meson setup mpv/build mpv "${opts[@]}"
          meson configure mpv/build | grep -E '^\s*gpl\s+false'
          meson install -C mpv/build
      - name: libmpv has hardware decoding
        run: |
          # FULLCONFIG in mpv's generated config.h lists every feature the build
          # actually enabled (what `mpv --version` prints), not the requested options.
          features=$(sed -n 's/^#define FULLCONFIG "\(.*\)"$/\1/p' mpv/build/config.h)
          echo "mpv features: $features"
          if [ -z "$features" ]; then echo "::error::FULLCONFIG not found in mpv/build/config.h"; exit 1; fi
          for f in gl egl drm vaapi vaapi-drm dmabuf-interop-gl; do
            [[ " $features " == *" $f "* ]] || { echo "::error::mpv was built without $f"; exit 1; }
          done
          for f in gpl x11; do
            [[ " $features " != *" $f "* ]] || { echo "::error::mpv was built with $f"; exit 1; }
          done
          hwdec=$(tr ' ' '\n' <<< "$features" \
            | grep -xE 'gl|egl|drm|vaapi(-[a-z0-9]+)?|dmabuf-[a-z-]+|vulkan|wayland|x11|vdpau|cuda-[a-z-]+' \
            | tr '\n' ' ')
          echo "$features" > "$RUNNER_TEMP/mpv-features"
          echo "${hwdec% }" > "$RUNNER_TEMP/mpv-hwdec-features"
      - name: Package
        run: |
          mkdir -p dist/lib dist/include dist/LICENSES
          cp -a out/lib/libmpv.so* out/lib/libav*.so* out/lib/libsw*.so* out/lib/libplacebo.so* \
            out/lib/libdav1d.so* out/lib/libdisplay-info.so* dist/lib/
          for f in dist/lib/*.so.*; do
            [ -L "$f" ] && continue
            strip --strip-debug "$f"
            patchelf --set-rpath '$ORIGIN' "$f"
          done
          cp -a out/include/mpv dist/include/
          cp mpv/LICENSE.LGPL dist/LICENSES/mpv-LGPL-2.1.txt
          cp ffmpeg/COPYING.LGPLv2.1 dist/LICENSES/ffmpeg-LGPL-2.1.txt
          cp libplacebo/LICENSE dist/LICENSES/libplacebo-LGPL-2.1.txt
          cp dav1d/COPYING dist/LICENSES/dav1d-BSD-2.txt
          cp libdisplay-info/LICENSE dist/LICENSES/libdisplay-info-MIT.txt
          # libdisplay-info compiles in a table generated from hwdata's pnp.ids.
          cp /usr/share/doc/hwdata/copyright dist/LICENSES/hwdata-copyright.txt
          # mpv's gpl value is read back from the configured build, not echoed.
          gpl=$(meson introspect --buildoptions mpv/build \
            | python3 -c 'import json,sys; print(json.dumps([o["value"] for o in json.load(sys.stdin) if o["name"] == "gpl"][0]))')
          [ "$gpl" = false ]
          {
            echo "mpv $MPV_REF $(git -C mpv rev-parse HEAD) gpl=$gpl"
            echo "  meson setup: $(cat "$RUNNER_TEMP/mpv-options")"
            echo "  hardware decoding features: $(cat "$RUNNER_TEMP/mpv-hwdec-features")"
            echo "  all features: $(cat "$RUNNER_TEMP/mpv-features")"
            echo "ffmpeg $FFMPEG_REF $(git -C ffmpeg rev-parse HEAD)"
            echo "  configure: $(sed -n 's/^#define FFMPEG_CONFIGURATION "\(.*\)"$/\1/p' ffmpeg/config.h)"
            echo "libplacebo $LIBPLACEBO_REF $(git -C libplacebo rev-parse HEAD)"
            echo "  meson setup: $(cat "$RUNNER_TEMP/libplacebo-options")"
            echo "dav1d $DAV1D_REF $(git -C dav1d rev-parse HEAD)"
            echo "  meson setup: $(cat "$RUNNER_TEMP/dav1d-options")"
            echo "libdisplay-info $LIBDISPLAY_INFO_REF $(git -C libdisplay-info rev-parse HEAD)"
            echo "  meson setup: $(cat "$RUNNER_TEMP/libdisplay-info-options")"
            echo "hwdata (pnp.ids) $(dpkg-query -W -f='${Version}' hwdata)"
            echo "built on $(. /etc/os-release && echo "$PRETTY_NAME"), glibc $(ldd --version | head -1 | awk '{print $NF}')"
          } > dist/BUILD-INFO.txt
          cat dist/BUILD-INFO.txt
          tar -C dist -czf libmpv-linux-x86_64.tar.gz .
          sha256sum libmpv-linux-x86_64.tar.gz | tee libmpv-linux-x86_64.tar.gz.sha256
      - name: Only portable system libraries are needed
        run: |
          # Every NEEDED entry must be bundled or have the same soname on every
          # supported distribution. libz.so.1 is universal and FFmpeg/mpv need it
          # for zlib-compressed Matroska tracks.
          allowed='^(ld-linux-x86-64\.so\.2|libc\.so\.6|libm\.so\.6|libdl\.so\.2|libpthread\.so\.0|librt\.so\.1|libresolv\.so\.2|libstdc\+\+\.so\.6|libgcc_s\.so\.1|libatomic\.so\.1'
          allowed+='|libX[A-Za-z0-9]*\.so\.[0-9]+|libxcb(-[a-z0-9-]+)?\.so\.[0-9]+|libwayland-(client|cursor|egl)\.so\.[0-9]+'
          allowed+='|libxkbcommon\.so\.0|libEGL\.so\.1|libGL\.so\.1|libvulkan\.so\.1|libva(-drm|-x11|-wayland)?\.so\.2'
          allowed+='|libdrm\.so\.2|libass\.so\.9|libfreetype\.so\.6|libfribidi\.so\.0|libharfbuzz\.so\.0'
          allowed+='|libpulse\.so\.0|libasound\.so\.2|libpipewire-0\.3\.so\.0|libz\.so\.1)$'
          bundled=$(ls dist/lib)
          needed=$(for f in dist/lib/*.so.*; do [ -L "$f" ] || readelf -d "$f"; done \
            | sed -n 's/.*(NEEDED).*\[\(.*\)\]/\1/p' | sort -u)
          echo "NEEDED across all shipped libraries:"; echo "$needed"
          if [ -z "$needed" ]; then echo "::error::No NEEDED entries found; the check would pass vacuously"; exit 1; fi
          bad=$(echo "$needed" | grep -vxF -f <(echo "$bundled") | grep -vE "$allowed" || true)
          if [ -n "$bad" ]; then echo "::error::Non-portable NEEDED entries:"; echo "$bad"; exit 1; fi
          for f in dist/lib/*.so.*; do
            [ -L "$f" ] || readelf -d "$f" | grep -q 'RUNPATH.*\[\$ORIGIN\]' || { echo "::error::$f lacks RUNPATH \$ORIGIN"; exit 1; }
          done
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          # Every build is its own immutable release: scripts/libmpv.lock.json pins
          # a URL and SHA256, and the build is not bit-reproducible, so a published
          # asset must never be replaced. `gh release create` fails if the tag exists.
          tag="libmpv-linux-$MPV_REF-b$GITHUB_RUN_NUMBER"
          gh release create "$tag" libmpv-linux-x86_64.tar.gz libmpv-linux-x86_64.tar.gz.sha256 \
            --target "$GITHUB_SHA" --title "libmpv $MPV_REF build $GITHUB_RUN_NUMBER (Linux, LGPL)" \
            --notes-file dist/BUILD-INFO.txt --prerelease
