name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  publish-tauri:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-latest
            args: ''
          # No Windows leg yet: Grid's own LGPL build is pinned
          # (src-tauri/licenses/README.md), and the leg returns once FFmpeg n7.1.5
          # is pinned for both platforms and the MSI passes a clean-machine check.

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies (Ubuntu only)
        if: matrix.platform == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            libass-dev \
            libva-dev \
            libvulkan-dev \
            libpulse-dev \
            libasound2-dev \
            libdrm-dev \
            libegl-dev \
            libx11-dev

      - name: Install frontend dependencies
        run: npm ci

      - name: Fetch the bundled libmpv (Linux)
        if: matrix.platform == 'ubuntu-latest'
        run: npm run setup:libmpv -- --bundle

      # The LGPL wants the bundled libmpv's source offered beside the
      # installers: link the pinned build's source archive from the release,
      # and refuse to publish if that archive is missing.
      - name: Locate the libmpv source (Linux)
        if: matrix.platform == 'ubuntu-latest'
        run: |
          url=$(node -p "require('./scripts/libmpv.lock.json')['linux-x86_64'].url.replace(/[^/]+$/, 'libmpv-linux-source.tar.xz')")
          curl -fsSIL "$url" > /dev/null || { echo "::error::No source archive at $url"; exit 1; }
          echo "LIBMPV_SOURCE_URL=$url" >> "$GITHUB_ENV"

      # tauri.windows.conf.json bundles the DLL beside grid.exe.
      - name: Set up libmpv (Windows)
        if: matrix.platform == 'windows-latest'
        run: npm run setup:libmpv

      - name: Build and Publish Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Same reason as package.json's bundle:linux script (used by
          # .github/workflows/ci.yml): linuxdeploy resolves the AppImage's
          # dependencies with its own ldd before the bundle's directory layout
          # exists, so the binary's $ORIGIN/../lib/grid RUNPATH resolves
          # nowhere yet. An empty LD_LIBRARY_PATH on Windows is inert.
          LD_LIBRARY_PATH: ${{ matrix.platform == 'ubuntu-latest' && format('{0}/src-tauri/lib/linux-runtime', github.workspace) || '' }}
        with:
          tagName: v__VERSION__
          releaseName: 'Grid v__VERSION__'
          releaseBody: |
            Download the installers below for Linux.

            The Linux packages bundle libmpv and FFmpeg (LGPL-2.1-or-later). Their complete source: ${{ env.LIBMPV_SOURCE_URL }}. Licences and how to replace the library: src-tauri/licenses/README.md.
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}
