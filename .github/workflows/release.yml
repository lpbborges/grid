name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  publish-tauri:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-latest
            args: ''
          - platform: windows-latest
            args: ''

    runs-on: ${{ matrix.platform }}
    steps:
      # Grid links libmpv in-process on Linux and Windows, and nothing here
      # packages it yet. Adding the missing piece alone does not fix that:
      # installing libmpv-dev makes the Linux build link Ubuntu's libmpv, a GPL
      # build the package would then depend on, and running setup:libmpv
      # builds Windows against a DLL the installer does not ship, so the app
      # fails to start. Packaging an LGPL-2.1+ libmpv, with its licence text
      # and source offer, is PR 2 of the libmpv plan; remove this step there.
      - name: Block releases until libmpv is packaged
        shell: bash
        run: |
          echo "::error::Releases are blocked until libmpv is packaged (PR 2 of the libmpv plan)"
          exit 1

      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies (Ubuntu only)
        if: matrix.platform == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            libass-dev \
            libva-dev \
            libvulkan-dev \
            libpulse-dev \
            libasound2-dev \
            libdrm-dev \
            libegl-dev \
            libx11-dev

      - name: Install frontend dependencies
        run: npm ci

      - name: Fetch the bundled libmpv (Linux)
        if: matrix.platform == 'ubuntu-latest'
        run: npm run setup:libmpv -- --bundle

      - name: Build and Publish Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v__VERSION__
          releaseName: 'Grid v__VERSION__'
          releaseBody: 'Download the installers below for Linux and Windows.'
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}
