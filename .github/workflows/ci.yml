name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npx prettier --check .
      - run: npm run check
      - run: npm run check:e2e
      - run: npm run test:frontend

  rust:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: src-tauri
    steps:
      - uses: actions/checkout@v7
      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            libmpv-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test

  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm audit --audit-level=high
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit
      - run: cargo audit
        working-directory: src-tauri

  e2e:
    needs: [frontend, rust]
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential curl wget file libxdo-dev libssl-dev \
            libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf \
            webkit2gtk-driver xvfb pulseaudio libmpv-dev \
            gstreamer1.0-plugins-base gstreamer1.0-plugins-good gstreamer1.0-plugins-bad gstreamer1.0-libav \
            imagemagick libgl1-mesa-dri
          pulseaudio -D --exit-idle-time=-1
      - name: Install Edge WebDriver matching WebView2
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          cargo install --git https://github.com/chippers/msedgedriver-tool --rev 8c4b34f51b45f5cf08013366d703de464ab871d1
          & "$env:USERPROFILE\.cargo\bin\msedgedriver-tool.exe"
          "NATIVE_DRIVER=$PWD\msedgedriver.exe" | Out-File -FilePath $env:GITHUB_ENV -Append
      - run: npm ci
      - name: Set up libmpv (Windows)
        if: runner.os == 'Windows'
        run: npm run setup:libmpv
      - run: cargo install tauri-driver --locked
      - name: Real engine tests on this platform
        working-directory: src-tauri
        run: cargo test -- playback_engine_tests engine_process
      - run: npm run build:e2e
      - name: Run E2E specs (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run --auto-servernum --server-args="-screen 0 1280x800x24" npm run test:e2e:run
      - name: Allow WebView2 remote debugging for the elevated E2E app
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $key = 'HKLM:\SOFTWARE\Policies\Microsoft\Edge\WebView2\AdditionalBrowserArguments'
          New-Item -Path $key -Force | Out-Null
          New-ItemProperty -Path $key -Name 'grid.exe' -Value '--remote-debugging-port=0 --autoplay-policy=no-user-gesture-required --mute-audio --use-fake-device-for-media-stream --use-fake-ui-for-media-stream' -PropertyType String -Force | Out-Null
      - name: Run E2E specs (Windows)
        if: runner.os == 'Windows'
        run: npm run test:e2e:run
      - run: npm run build:e2e:native
      - name: Run native E2E (Linux, under a decimal-comma locale)
        if: runner.os == 'Linux'
        run: |
          sudo locale-gen de_DE.UTF-8
          LC_ALL=de_DE.UTF-8 xvfb-run --auto-servernum --server-args="-screen 0 1280x800x24" npm run test:e2e:native:run
      - name: Run native E2E (Windows)
        if: runner.os == 'Windows'
        run: npm run test:e2e:native:run
      - name: Run render smoke E2E (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run --auto-servernum --server-args="-screen 0 1280x800x24 +extension GLX" npm run test:e2e:render:run
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: e2e-artifacts-${{ matrix.os }}
          path: e2e/artifacts/
