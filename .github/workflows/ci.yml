name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npx prettier --check .
      - run: npm run check
      - run: npm run check:e2e
      - run: npm run test:frontend

  rust:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: src-tauri
    steps:
      - uses: actions/checkout@v7
      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test

  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm audit --audit-level=high
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit
      - run: cargo audit
        working-directory: src-tauri

  e2e:
    needs: [frontend, rust]
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential curl wget file libxdo-dev libssl-dev \
            libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf \
            webkit2gtk-driver xvfb pulseaudio \
            gstreamer1.0-plugins-base gstreamer1.0-plugins-good gstreamer1.0-plugins-bad gstreamer1.0-libav
          pulseaudio -D --exit-idle-time=-1
      - name: Install Edge WebDriver matching WebView2
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          cargo install --git https://github.com/chippers/msedgedriver-tool --rev 8c4b34f51b45f5cf08013366d703de464ab871d1
          & "$env:USERPROFILE\.cargo\bin\msedgedriver-tool.exe"
          "NATIVE_DRIVER=$PWD\msedgedriver.exe" | Out-File -FilePath $env:GITHUB_ENV -Append
      - run: cargo install tauri-driver --locked
      - run: npm ci
      - name: Real engine tests on this platform
        working-directory: src-tauri
        run: cargo test playback_engine_tests
      - run: npm run build:e2e
      - name: Run E2E specs (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run --auto-servernum --server-args="-screen 0 1280x800x24" npm run test:e2e:run
      - name: Diagnose WebView2 automation (temporary)
        if: runner.os == 'Windows'
        continue-on-error: true
        shell: pwsh
        run: |
          $exe = "$PWD\src-tauri\target\debug\grid-play.exe"
          Get-Item $exe | Select-Object FullName, Length
          (Get-Item "C:\Program Files (x86)\Microsoft\EdgeWebView\Application\*\msedgewebview2.exe" -ErrorAction SilentlyContinue).VersionInfo.FileVersion
          & "$env:NATIVE_DRIVER" --version
          Write-Output "== direct launch with a remote debugging port"
          $env:WEBVIEW2_ADDITIONAL_BROWSER_ARGUMENTS = "--remote-debugging-port=9333"
          $p = Start-Process -FilePath $exe -PassThru -RedirectStandardOutput "$env:RUNNER_TEMP\app-out.txt" -RedirectStandardError "$env:RUNNER_TEMP\app-err.txt"
          Start-Sleep -Seconds 20
          "HasExited=$($p.HasExited) ExitCode=$($p.ExitCode)"
          Get-CimInstance Win32_Process | Where-Object { $_.Name -match 'grid-play|msedgewebview2' } | Select-Object ProcessId, ParentProcessId, CommandLine | Format-List
          try { (Invoke-WebRequest -UseBasicParsing http://127.0.0.1:9333/json/version -TimeoutSec 5).Content } catch { "CDP 9333 unreachable: $_" }
          Get-ChildItem -Recurse -Filter DevToolsActivePort "$env:LOCALAPPDATA\com.lp01.grid-play.e2e" -ErrorAction SilentlyContinue | Select-Object FullName
          Get-Content "$env:RUNNER_TEMP\app-out.txt", "$env:RUNNER_TEMP\app-err.txt" -ErrorAction SilentlyContinue
          Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue
          Get-Process msedgewebview2 -ErrorAction SilentlyContinue | Stop-Process -Force
          Remove-Item Env:WEBVIEW2_ADDITIONAL_BROWSER_ARGUMENTS
          Start-Sleep -Seconds 3
          Write-Output "== msedgedriver launch"
          $driver = Start-Process -FilePath $env:NATIVE_DRIVER -ArgumentList "--port=9515", "--verbose", "--log-path=$env:RUNNER_TEMP\msedgedriver.log" -PassThru
          Start-Sleep -Seconds 3
          $body = @{ capabilities = @{ alwaysMatch = @{ browserName = "webview2"; "ms:edgeChromium" = $true; "ms:edgeOptions" = @{ binary = $exe; args = @(); webviewOptions = @{} } } } } | ConvertTo-Json -Depth 6
          $job = Start-Job { param($b) try { (Invoke-WebRequest -UseBasicParsing -Method Post -ContentType "application/json" -Body $b http://127.0.0.1:9515/session -TimeoutSec 90).Content } catch { "session error: $_" } } -ArgumentList $body
          Start-Sleep -Seconds 20
          Get-CimInstance Win32_Process | Where-Object { $_.Name -match 'grid-play|msedgewebview2' } | Select-Object ProcessId, ParentProcessId, CommandLine | Format-List
          Wait-Job $job -Timeout 90 | Out-Null
          Receive-Job $job
          Stop-Process -Id $driver.Id -Force -ErrorAction SilentlyContinue
          Get-Process grid-play, msedgewebview2 -ErrorAction SilentlyContinue | Stop-Process -Force
          Get-Content "$env:RUNNER_TEMP\msedgedriver.log" -Tail 150
      - name: Run E2E specs (Windows)
        if: runner.os == 'Windows'
        run: npm run test:e2e:run
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: e2e-artifacts-${{ matrix.os }}
          path: e2e/artifacts/
