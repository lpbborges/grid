name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npx prettier --check .
      - run: npm run check
      - run: npm run check:e2e
      - run: npm run test:frontend

  rust:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: src-tauri
    steps:
      - uses: actions/checkout@v7
      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            libmpv-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test

  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm audit --audit-level=high
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit
      - run: cargo audit
        working-directory: src-tauri

  package-linux:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Install Tauri bundling dependencies
        # No libmpv-dev here: linking must resolve libmpv.so.2 only through the
        # bundled copy in src-tauri/lib/linux, never a system package, so a
        # wrong link cannot hide behind one installed for development.
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential curl wget file libxdo-dev libssl-dev \
            libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf \
            libfuse2 rpm \
            libass-dev libva-dev libvulkan-dev libpulse-dev libasound2-dev \
            libdrm-dev libegl-dev libx11-dev
      - run: npm ci
      - name: Fetch the bundled libmpv (Linux)
        run: npm run setup:libmpv -- --bundle
      - name: Build the deb, rpm and AppImage bundles
        # linuxdeploy (which the AppImage bundler shells out to) resolves the
        # binary's dependencies with its own ldd before the bundle's directory
        # layout exists, so target/release/grid's $ORIGIN/../lib/grid RUNPATH
        # resolves nowhere yet. Point LD_LIBRARY_PATH at the bundled copy for
        # this step only, so it finds and packages that copy instead of
        # silently skipping libmpv or grabbing a system one.
        run: |
          export LD_LIBRARY_PATH="$PWD/src-tauri/lib/linux-runtime"
          npx tauri build --bundles deb,rpm,appimage
      - name: Check (a) the .deb ships the bundled libmpv
        run: |
          set -euo pipefail
          deb="$(ls src-tauri/target/release/bundle/deb/*.deb)"
          echo "Checking $deb"
          # dpkg -c paths are not consistently prefixed with "./".
          dpkg -c "$deb" | awk '{print $NF}' | tee /tmp/deb-contents.txt
          grep -Eq '^(\./)?usr/lib/grid/libmpv\.so\.2$' /tmp/deb-contents.txt
      - name: Check (b) the .rpm ships the bundled libmpv
        run: |
          set -euo pipefail
          rpm_file="$(ls src-tauri/target/release/bundle/rpm/*.rpm)"
          echo "Checking $rpm_file"
          rpm -qlp "$rpm_file" | tee /tmp/rpm-contents.txt
          grep -Eq '^/?(\./)?usr/lib/grid/libmpv\.so\.2$' /tmp/rpm-contents.txt
      - name: Check (c) the AppImage's binary resolves libmpv to its own bundled copy
        run: |
          set -euo pipefail
          appimage="$(ls src-tauri/target/release/bundle/appimage/*.AppImage)"
          echo "Checking $appimage"
          "$appimage" --appimage-extract >/dev/null
          resolved="$(env -u LD_LIBRARY_PATH ldd squashfs-root/usr/bin/grid | grep libmpv.so.2 || true)"
          echo "ldd result: $resolved"
          if [ -z "$resolved" ]; then
            echo "::error::libmpv.so.2 not found by ldd"
            exit 1
          fi
          path="$(echo "$resolved" | sed -n 's/.*=> \(\S*\) .*/\1/p')"
          case "$path" in
            "$PWD"/squashfs-root/*) ;;
            *)
              echo "::error::libmpv.so.2 resolved to '$path', not inside squashfs-root"
              exit 1
              ;;
          esac
      - name: Check (d) the binary's RUNPATH points at the bundled libmpv
        run: |
          set -euo pipefail
          out="$(readelf -d src-tauri/target/release/grid | grep RUNPATH || true)"
          echo "$out"
          echo "$out" | grep -q '\$ORIGIN/\.\./lib/grid' || { echo "::error::RUNPATH is missing \$ORIGIN/../lib/grid"; exit 1; }
          echo "$out" | grep -Eq '\$ORIGIN/\.\./lib(:|\])' || { echo "::error::RUNPATH is missing \$ORIGIN/../lib"; exit 1; }
      - name: Check (e) only SONAME-named library files and LICENSES ship under usr/lib/grid
        run: |
          set -euo pipefail
          # Allowed: one real file per SONAME (e.g. libmpv.so.2) and anything
          # under LICENSES/. Rejected: unversioned dev symlinks (libmpv.so),
          # full-version files (libmpv.so.2.5.0), the setup stamp file, and
          # (after R30, there should be none) symlink entries.
          #
          # /tmp/deb-contents.txt (written by check a) already holds dpkg -c's
          # last column, one path per line, with an optional "./" prefix that
          # varies by tauri-bundler version. Strip it unconditionally with a
          # plain `sed 's#^\./##'` — `sed -n '...p'` would silently drop every
          # line when none happen to have the prefix, emptying the whole list
          # without ever erroring.
          if grep -q -- '->' /tmp/deb-contents.txt; then
            echo "::error::.deb listing contains a symlink; every shipped library must be a real SONAME file"
            grep -- '->' /tmp/deb-contents.txt
            exit 1
          fi
          deb_entries="$(sed 's#^\./##' /tmp/deb-contents.txt | { grep '^usr/lib/grid/' || true; } | { grep -v '/$' || true; } | sed 's#^usr/lib/grid/##')"
          echo "deb entries under usr/lib/grid:"; echo "$deb_entries"
          if [ -z "$deb_entries" ]; then echo "::error::No .deb entries found under usr/lib/grid; the check would pass vacuously"; exit 1; fi
          bad_deb="$(echo "$deb_entries" | { grep -vE '^(LICENSES(/.+)?|lib[A-Za-z0-9+_.-]+\.so\.[0-9]+)$' || true; })"
          if [ -n "$bad_deb" ]; then echo "::error::Unexpected .deb entries under usr/lib/grid:"; echo "$bad_deb"; exit 1; fi

          # /tmp/rpm-contents.txt (written by check b) holds rpm -qlp's plain
          # absolute paths, one per line, no symlink notation.
          rpm_entries="$(sed -n 's#^/usr/lib/grid/##p' /tmp/rpm-contents.txt | { grep -v '^$' || true; })"
          echo "rpm entries under usr/lib/grid:"; echo "$rpm_entries"
          if [ -z "$rpm_entries" ]; then echo "::error::No .rpm entries found under usr/lib/grid; the check would pass vacuously"; exit 1; fi
          bad_rpm="$(echo "$rpm_entries" | { grep -vE '^(LICENSES(/.+)?|lib[A-Za-z0-9+_.-]+\.so\.[0-9]+)$' || true; })"
          if [ -n "$bad_rpm" ]; then echo "::error::Unexpected .rpm entries under usr/lib/grid:"; echo "$bad_rpm"; exit 1; fi
      - uses: actions/upload-artifact@v7
        with:
          name: linux-packages
          path: |
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/rpm/*.rpm
            src-tauri/target/release/bundle/appimage/*.AppImage

  e2e:
    needs: [frontend, rust]
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential curl wget file libxdo-dev libssl-dev \
            libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf \
            webkit2gtk-driver xvfb pulseaudio libmpv-dev \
            gstreamer1.0-plugins-base gstreamer1.0-plugins-good gstreamer1.0-plugins-bad gstreamer1.0-libav \
            imagemagick libgl1-mesa-dri
          pulseaudio -D --exit-idle-time=-1
      - name: Install Edge WebDriver matching WebView2
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          cargo install --git https://github.com/chippers/msedgedriver-tool --rev 8c4b34f51b45f5cf08013366d703de464ab871d1
          & "$env:USERPROFILE\.cargo\bin\msedgedriver-tool.exe"
          "NATIVE_DRIVER=$PWD\msedgedriver.exe" | Out-File -FilePath $env:GITHUB_ENV -Append
      - run: npm ci
      - name: Set up libmpv (Windows)
        if: runner.os == 'Windows'
        run: npm run setup:libmpv
      - run: cargo install tauri-driver --locked
      - name: Real engine tests on this platform
        working-directory: src-tauri
        run: cargo test -- playback_engine_tests engine_process
      - run: npm run build:e2e
      - name: Run E2E specs (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run --auto-servernum --server-args="-screen 0 1280x800x24" npm run test:e2e:run
      - name: Allow WebView2 remote debugging for the elevated E2E app
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $key = 'HKLM:\SOFTWARE\Policies\Microsoft\Edge\WebView2\AdditionalBrowserArguments'
          New-Item -Path $key -Force | Out-Null
          New-ItemProperty -Path $key -Name 'grid.exe' -Value '--remote-debugging-port=0 --autoplay-policy=no-user-gesture-required --mute-audio --use-fake-device-for-media-stream --use-fake-ui-for-media-stream' -PropertyType String -Force | Out-Null
      - name: Run E2E specs (Windows)
        if: runner.os == 'Windows'
        run: npm run test:e2e:run
      - run: npm run build:e2e:native
      - name: Run native E2E (Linux, under a decimal-comma locale)
        if: runner.os == 'Linux'
        run: |
          sudo locale-gen de_DE.UTF-8
          LC_ALL=de_DE.UTF-8 xvfb-run --auto-servernum --server-args="-screen 0 1280x800x24" npm run test:e2e:native:run
      - name: Run native E2E (Windows)
        if: runner.os == 'Windows'
        run: npm run test:e2e:native:run
      - name: Run render smoke E2E (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run --auto-servernum --server-args="-screen 0 1280x800x24 +extension GLX" npm run test:e2e:render:run
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: e2e-artifacts-${{ matrix.os }}
          path: e2e/artifacts/
